spring.application.name=doctor_portal

spring.datasource.url=jdbc:postgresql://localhost:5433/postgres 
spring.datasource.username=postgres
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# оптимизация SQL запросов: печать каждого SQL в консоль сильно тормозит сервер под нагрузкой
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
#logging.level.org.hibernate.orm.jdbc.bind=trace было

# оптимизация SQL запросов: лимит пула соединений, чтобы толпа запросов не завалила базу
spring.datasource.hikari.maximum-pool-size=10

server.port=8081


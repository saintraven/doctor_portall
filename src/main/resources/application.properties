spring.application.name=doctor_portal

spring.datasource.url=jdbc:postgresql://localhost:5433/postgres
spring.datasource.username=postgres
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

# тюнинг под нагрузку: настройки пула соединений Hikari

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# тюнинг под нагрузку: отключено SQL-логирование
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.org.hibernate.orm.jdbc.bind=WARN 



# тюнинг под нагрузку: три числа согласованы между собой. Раньше 200 дефолтных
# потоков Tomcat дрались за 40 соединений с таймаутом 1.5с — под нагрузкой это
# SQLTransientConnectionException -> 500. Теперь: 50 потоков Tomcat (хватает на
# 100 юзеров при мс-ответах и не душит 1 CPU контейнера), пул 15 (транзакции
# короткие, 1 запрос = 1 соединение, БД в compose лимитирована 0.5 CPU — больше
# соединений не дают пропускной способности), таймаут 3с — очередь ждёт, а не падает
server.tomcat.threads.max=50
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=30000

# тюнинг под нагрузку: без exposure actuator отдаёт только /health — /actuator/prometheus нужен, чтобы видеть метрики во время прогона
management.endpoints.web.exposure.include=health,prometheus,metrics

# тюнинг под нагрузку: статистика Hibernate — единственный способ посчитать SQL-на-запрос и доказать/опровергнуть N+1 (pg_stat_statements на стенде недоступен)
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN
